name: Build Drift Horizon Android APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Accept Android SDK Licenses & Install Components
        run: |
          echo "Accepting Android SDK licenses..."
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true
          echo "Ensuring Android SDK Platform 36 is present..."
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" || true

      - name: Verify Gradle Wrapper
        run: |
          # If gradle-wrapper.jar was not committed or lost during git push, restore it
          if [ ! -s "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "gradle-wrapper.jar not found or empty. Restoring wrapper..."
            mkdir -p gradle/wrapper
            curl -fsSL "https://raw.githubusercontent.com/gradle/gradle/v8.11.1/gradle/wrapper/gradle-wrapper.jar" -o gradle/wrapper/gradle-wrapper.jar || true
          fi
          # Fix CRLF line endings for Unix execution
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Prepare Keystore and Configuration
        run: |
          # Ensure .env exists for Secrets Gradle plugin
          touch .env
          cp -n .env.example .env 2>/dev/null || true
          cp .env app/.env 2>/dev/null || true

          # Decode debug.keystore from base64 if present
          if [ -s "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          fi

          # Fallback: Generate debug.keystore if still missing
          if [ ! -s "debug.keystore" ]; then
            echo "Generating fallback debug.keystore..."
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Place in both root and app/ directory to ensure Gradle finds it
          cp debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Build Debug APK with Gradle
        run: ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Drift-Horizon-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
